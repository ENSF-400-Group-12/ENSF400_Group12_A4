name: CI Checks

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    frontend:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
          - name: Checkout repo
            uses: actions/checkout@v4

          - name: Setup Node
            uses: actions/setup-node@v4
            with:
                node-version: 20
                cache: npm
                cache-dependency-path: frontend/package-lock.json

          - name: Install dependencies
            run: npm install

          - name: Run tests
            run: npm test -- --watchAll=false

          - name: Build frontend
            run: npm run build

    backend:
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: backend

        steps:
          - name: Checkout repo
            uses: actions/checkout@v4

          - name: Setup Node
            uses: actions/setup-node@v4
            with:
                node-version: 20
                cache: npm
                cache-dependency-path: backend/package-lock.json

          - name: Install dependencies
            run: npm install
